<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <ul id="exchange-rate"></ul>
    <script>

        function fetchJson(path){
            fetch(path)
            .then(r  => r.json())
            .then(data => {
                console.log(data);
            })
            .catch(err => console.error(err));
        }

        function fetchXml(path) {
            fetch(path)
                .then(r => r.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    console.log(xml);
                })
        }
        function xmlHttpRequest(path) {
            const xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    console.log(xhr.responseHML);
          
                }
            }

            xhr.open("GET", path);
            xhr.send();
        };

        function xmlHttpRequestJson(path) {
            const xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    console.log(JSON.parse(xhr.responseHML));
          
                }
            }

            xhr.open("GET", path);
            xhr.send();
        };

        function displayJson(data) {
            const ul = document.getElementById("exchange-rates");
            
            for (const item of data.exchangeRates) {
                const li = document.createEl
                li.innerText = `${item.fromCoin}: ${item.value} ${item.toCoin}`;
                ul.appendChild(li);
        
               
            }
        }

        function displayXml(data) {
            const ul = document.getElementById("exchange-rates");
            const rates = data.getElementsByTagName("rate");

            for (const item of rates) {
                const li = document.createElement("li");
                li.innerText = `${item.querySelector("fromCoin").textContent}: ${item.querySelector("value").textContent} ${item.querySelector("toCoin").textContent}`;
                ul.appendChild(li);
               
            }
        }

        fetchJson("curs.json");
        fetchXml("curs.xml");
        xmlHttpRequest("curs.xml");
        xmlHttpRequestJson("curs.json");

        localStorage.setItem("them", "dark");
        console.log(localStorage.getItem("theme"));
        localStorage.removeItem("theme");
    </script>

</body>
</html>
