        <!-- 
        - username
        - email
        - password
        - data nastere
        - termeni si conditii
        - grupa
        - numar matricol
        -->
        <label for="username">Username:</label>
            <input type="text" id="username" name="User"  required>

        <label for="email">Email:</label>
            <input type="email" id="email" name="Email">


        <label for="parola">Parola:</label>
            <input type="password" id="parola" name="Password" minlength="4" pattern="[a-z]+">
        
            <label for="DataN">Data nasterii:</label>
            <input type="date" id="DataN" name="DataNastere" min="2025-12-29">
            
            <label for="T&C">Termeni si conditii:</label>

            <br>

           <br/>

        <br/>

           <br/>

            <input type="number" id="NumarM" name="NumarMatricol" min="1" max="1000">

<br/>
